name: aos-foundation
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: aos
      POSTGRES_USER: aos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aos -d aos"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  aos_pgdata:

