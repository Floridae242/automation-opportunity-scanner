openapi: 3.1.0
info:
  title: Automation Opportunity Scanner API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Create account with owner organization and session (ADR-012)
      responses:
        '201': { description: Account created, session cookie set }
        '409': { description: Email in use }
  /auth/login:
    post:
      summary: Start a session
      responses:
        '200': { description: Authenticated, session cookie set }
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      summary: Current user, memberships, active organization
      responses:
        '200': { description: OK }
        '401': { description: Not authenticated }
  /auth/active-organization:
    post:
      summary: Switch active organization (rotates session)
      responses:
        '200': { description: Switched }
        '404': { description: Not a member (non-disclosing) }
  /projects:
    get:
      summary: List projects in active organization
      responses:
        '200': { description: OK }
    post:
      summary: Create project
      responses:
        '201': { description: Created }
  /projects/{projectId}:
    get:
      summary: Read project with its processes
      responses:
        '200': { description: OK }
        '404': { description: Not found in tenant scope }
    patch:
      summary: Rename or archive project (archive requires owner/admin)
      responses:
        '200': { description: Updated }
        '403': { description: Role not permitted }
  /projects/{projectId}/processes:
    post:
      summary: Create process
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Created }
  /processes/{processId}:
    get:
      summary: Read process with version history
      responses:
        '200': { description: OK }
        '404': { description: Not found in tenant scope }
  /processes/{processId}/intake:
    post:
      summary: Save workflow intake (new draft version; prior drafts superseded)
      parameters:
        - in: path
          name: processId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Saved }
  /processes/{processId}/analyses:
    post:
      summary: Start process analysis
      parameters:
        - in: path
          name: processId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Analysis accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
  /analyses/{analysisId}:
    get:
      summary: Get analysis status/result summary
      parameters:
        - in: path
          name: analysisId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /process-versions/{versionId}:
    patch:
      summary: Edit draft process version
      responses:
        '200': { description: Updated }
  /process-versions/{versionId}/review:
    post:
      summary: Mark process version reviewed
      responses:
        '200': { description: Reviewed }
  /analyses/{analysisId}/opportunities:
    get:
      summary: List scored opportunities
      responses:
        '200': { description: OK }
  /opportunities/{opportunityId}:
    get:
      summary: Get opportunity detail, score breakdown, recommendation, ROI scenarios
      responses:
        '200': { description: OK }
  /analyses/{analysisId}/reports:
    post:
      summary: Create report snapshot
      responses:
        '202': { description: Accepted }
  /processes/{processId}/documents:
    post:
      summary: Upload process document as untrusted intake evidence (FR-021, ADR-010)
      parameters:
        - in: path
          name: processId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Text or PDF within NFR-S03 size/type limits; parsed as untrusted content
      responses:
        '201': { description: Document stored as intake evidence }
        '413': { description: File too large }
        '415': { description: Unsupported media type }
  /reports/{reportId}/pdf:
    get:
      summary: Render stored report snapshot as PDF (FR-022; no live AI calls)
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF export
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Not found in tenant scope }
components:
  schemas:
    AnalysisAccepted:
      type: object
      required: [analysis_id, status]
      properties:
        analysis_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running] }
