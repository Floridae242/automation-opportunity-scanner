openapi: 3.1.0
info:
  title: Automation Opportunity Scanner API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Create account with owner organization and session (ADR-012)
      responses:
        '201': { description: "Account created; session cookie set" }
        '409': { description: Email in use }
  /auth/login:
    post:
      summary: Start a session
      responses:
        '200': { description: "Authenticated; session cookie set" }
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      summary: Current user, memberships, active organization
      responses:
        '200': { description: OK }
        '401': { description: Not authenticated }
  /auth/active-organization:
    post:
      summary: Switch active organization (rotates session)
      responses:
        '200': { description: Switched }
        '404': { description: Not a member (non-disclosing) }
  /projects:
    get:
      summary: List projects in active organization
      responses:
        '200': { description: OK }
    post:
      summary: Create project
      responses:
        '201': { description: Created }
  /projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read project with its processes
      responses:
        '200': { description: OK }
        '404': { description: Not found in tenant scope }
    patch:
      summary: Rename or archive project (archive requires owner/admin)
      responses:
        '200': { description: Updated }
        '403': { description: Role not permitted }
  /projects/{projectId}/processes:
    post:
      summary: Create process
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Created }
  /processes/{processId}:
    parameters:
      - in: path
        name: processId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read process with version history
      responses:
        '200': { description: OK }
        '404': { description: Not found in tenant scope }
  /processes/{processId}/intake:
    post:
      summary: Save workflow intake (new draft version; prior drafts superseded)
      parameters:
        - in: path
          name: processId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Saved }
  /processes/{processId}/analyses:
    post:
      summary: Start process analysis
      parameters:
        - in: path
          name: processId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Analysis accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
  /analyses/{analysisId}:
    get:
      summary: Get analysis status/result summary
      parameters:
        - in: path
          name: analysisId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /analyses/{analysisId}/report:
    get:
      summary: Read the latest stored report snapshot for an analysis
      parameters:
        - in: path
          name: analysisId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Report snapshot }
        '404': { description: No report in tenant scope }
  /process-versions/{versionId}:
    parameters:
      - in: path
        name: versionId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a process version with reviewed steps, systems, and evidence
      responses:
        '200': { description: OK }
    patch:
      summary: Edit draft process version
      responses:
        '200': { description: Updated }
  /process-versions/{versionId}/review:
    parameters:
      - in: path
        name: versionId
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark process version reviewed
      responses:
        '200': { description: Reviewed }
  /analyses/{analysisId}/opportunities:
    parameters:
      - in: path
        name: analysisId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List scored opportunities with band, confidence, and matrix axes
      responses:
        '200': { description: OK }
  /opportunities/{opportunityId}:
    parameters:
      - in: path
        name: opportunityId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Opportunity detail with per-dimension scores, evidence, and versioned score snapshot (ROI/recommendation added in M5)
      responses:
        '200': { description: OK }
  /portfolio/opportunities:
    get:
      summary: List tenant-scoped scored opportunities for portfolio triage
      parameters:
        - { in: query, name: department, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: min_score, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: min_confidence, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { in: query, name: result_state, schema: { type: string, enum: [final, provisional, insufficient_evidence] } }
        - { in: query, name: governance_review, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Ranked portfolio page }
  /analyses/{analysisId}/reports:
    parameters:
      - in: path
        name: analysisId
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Create report snapshot
      responses:
        '201': { description: Report snapshot created }
  /processes/{processId}/documents:
    parameters:
      - in: path
        name: processId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List sanitized metadata for process documents
      responses:
        '200': { description: Document metadata }
    post:
      summary: Upload UTF-8 text or a readable PDF as untrusted process evidence
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Document evidence accepted }
        '413': { description: File too large }
        '415': { description: Unsupported media type }
  /reports/{reportId}/pdf:
    get:
      summary: Render stored report snapshot as PDF (FR-022; no live AI calls)
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF export
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Not found in tenant scope }
  /reports/{reportId}/docx:
    get:
      summary: Render stored report snapshot as DOCX (no live AI calls)
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: DOCX export
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        '404': { description: Not found in tenant scope }
  /reports/{reportId}/slides:
    get:
      summary: Render stored report snapshot as PowerPoint slides (no live AI calls)
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PowerPoint export
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '404': { description: Not found in tenant scope }
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Application process is live }
  /health/ready:
    get:
      summary: Readiness probe including database connectivity
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
components:
  schemas:
    AnalysisAccepted:
      type: object
      required: [analysis_id, status]
      properties:
        analysis_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running] }
