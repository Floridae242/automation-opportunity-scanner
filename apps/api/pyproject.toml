[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pypdf>=6.16.1,<7", "python-docx>=1.2,<2", "python-multipart>=0.0.31,<1", "python-pptx>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "jsonschema>=4,<5", "openapi-spec-validator>=0.7,<1", "PyYAML>=6,<7", "pip-audit>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aos_api --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: requires a disposable PostgreSQL TEST_DATABASE_URL"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/aos_api/routes_auth.py" = ["B008"]
"src/aos_api/routes_intake.py" = ["B008"]
"src/aos_api/routes_analysis.py" = ["B008"]
"src/aos_api/routes_comments.py" = ["B008"]
"src/aos_api/routes_scoring.py" = ["B008"]
"src/aos_api/routes_catalog.py" = ["B008"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

plugins = ["pydantic.mypy"]
