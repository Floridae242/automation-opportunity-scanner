name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aos_test
          POSTGRES_USER: aos
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aos -d aos_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://aos:ci-ephemeral-only@127.0.0.1:55432/aos_test
      TEST_DATABASE_URL: postgresql+psycopg://aos:ci-ephemeral-only@127.0.0.1:55432/aos_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          npm ci
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements-dev.lock
          apps/api/.venv/bin/pip install --no-deps -e apps/api
      - name: Lint, formatting and types
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          apps/api/.venv/bin/ruff check apps/api
          apps/api/.venv/bin/ruff format --check apps/api
          cd apps/api
          .venv/bin/mypy
      - name: Backend unit, contract and PostgreSQL integration tests
        working-directory: apps/api
        run: .venv/bin/pytest
      - name: Frontend tests and production build
        run: |
          npm run test:coverage
          npm run build
      - name: Migrate for browser tests
        working-directory: apps/api
        run: .venv/bin/alembic upgrade head
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Dependency security checks
        run: |
          npm audit --audit-level=high
          apps/api/.venv/bin/pip-audit -r apps/api/requirements-dev.lock
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
